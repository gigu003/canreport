overall:
  default: >
    In {year}, the {age_specific_rate_label} of {cancer_name_lower} in {area_name} remained low among those aged {low_age_span}, increased markedly from age {rise_start_age} years onward, and peaked in the {peak_age_group} age group.
    {sex_trend_text}

    By sex, rates were higher in females than in males among those aged {female_higher_age_spans}, whereas rates were higher in males than in females among those aged {male_higher_age_spans}. {area_sex_trend_text}

    Urban-rural comparison showed that {area_comparison_text}; {area_sex_distribution_text}.

sex_trend:
  similar: >
    The age-specific rates in males and females showed broadly similar age-related trends, increasing rapidly from the {rise_start_age} years age group and reaching the highest level in the {peak_age_group} age group.
  different: >
    The age-specific rates in males and females showed some differences in age-related trends, but generally increased with age.

area_sex_trend:
  similar: >
    Age-specific rates in urban and rural areas showed similar trends in both males and females.
  different: >
    Age-specific rates in urban and rural areas showed some trend differences by sex.

area_sex_distribution:
  similar: >
    the urban-rural distribution patterns were broadly similar in males and females
  different: >
    the urban-rural distribution patterns differed between males and females

area_comparison:
  urban_slight: >
    urban rates were slightly higher than rural rates among those aged {urban_slight_age_spans}
  urban_obvious: >
    urban rates were markedly higher than rural rates among those aged {urban_obvious_age_spans}
  rural_higher: >
    rural rates were higher than urban rates among those aged {rural_higher_age_spans}
  similar: >
    urban and rural rates were similar across age groups
